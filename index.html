<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails WCAG
         1.4.4, and low-vision users rely on it. The iOS zoom-on-focus this is
         usually added to stop is handled properly instead, by keeping every
         input at 16px (see .auth-input in index.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Agently - Your AI Team, Built Around Your Business</title>
    <link rel="icon" type="image/png" href="/agently-favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      (() => {
        const viewportContent =
          "width=device-width, initial-scale=1, viewport-fit=cover";
        const applyMobileViewport = () => {
          const viewport = document.querySelector('meta[name="viewport"]');
          if (
            viewport &&
            viewport.getAttribute("content") !== viewportContent
          ) {
            viewport.setAttribute("content", viewportContent);
          }
          document.documentElement.style.setProperty(
            "--agently-viewport-width",
            `${Math.max(320, window.innerWidth)}px`,
          );
        };
        applyMobileViewport();
        window.addEventListener("orientationchange", () => {
          window.setTimeout(applyMobileViewport, 80);
          window.setTimeout(applyMobileViewport, 300);
        });
        window.addEventListener("pageshow", applyMobileViewport);
        document.addEventListener("visibilitychange", applyMobileViewport);
      })();
    </script>
    <!--
      Deep-link normalization: the app reads routes from the URL hash and the
      static host rewrites every path to this document, so a shared plain link
      like /pricing would boot the router on an empty hash and render the
      homepage. This folds the plain path into the hash before React boots,
      with no reload and the query string preserved: /pricing?x=1 -> /#/pricing?x=1
      Classic inline script (not a module): it must run synchronously during
      parsing, before the app entry, with zero build or chunk dependencies.
      The exact shipped code is executed by test/deepLink.test.ts — keep the
      marker comments intact.
    -->
    <script>
      /* deep-link-normalize:start */
      (() => {
        try {
          const loc = window.location;
          const path = loc.pathname;
          if (!loc.hash && path && path !== "/" && path !== "/index.html") {
            window.history.replaceState(null, "", "/#" + path + loc.search);
          }
        } catch {
          /* storage/history quirks must never block the boot */
        }
      })();
      /* deep-link-normalize:end */
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
